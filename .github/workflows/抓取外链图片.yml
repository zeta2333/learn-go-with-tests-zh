name: 抓取外链图片

# 用途：本地网络不可达的外链图片（如 imgur），由 Actions 服务器代取并提交入库。
# 新增外链图片时在 steps 里追加 curl 行，然后 gh workflow run 抓取外链图片.yml

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载外链图片
        run: |
          curl -fsSL -o docs/assets/mutex-misuse.png "https://i.imgur.com/SWYNpwm.png"
          curl -fsSL -o docs/assets/diff-tool.png "https://i.imgur.com/0MoNdva.png"
          curl -fsSL -o docs/assets/extract-variable.png "https://i.imgur.com/4sgUG7L.png"
          curl -fsSL -o docs/assets/riya-talk.png "https://i.imgur.com/bbG6z57.png"
          curl -fsSL -o docs/assets/farley-at-structure.png "https://i.imgur.com/nPwpihG.png"
          curl -fsSL -o docs/assets/separation-of-concerns-go.png "https://i.imgur.com/qdY4RJe.png"
          curl -fsSL -o docs/assets/tdd-top-down-1.png "https://i.imgur.com/pxTaYu4.png"
          curl -fsSL -o docs/assets/tdd-top-down-2.png "https://i.imgur.com/t5y5opw.png"
          curl -fsSL -o docs/assets/tdd-top-down-3.png "https://i.imgur.com/UYqd7Cq.png"
          curl -fsSL -o docs/assets/ports-adapters-architecture.png "https://i.imgur.com/6bqovl8.png"
          curl -fsSL -o docs/assets/fake-integration-test.png "https://i.imgur.com/9Q6FMpw.png"
          curl -fsSL -o docs/assets/fake-contract.png "https://i.imgur.com/l9aTe2x.png"
          curl -fsSL -o docs/assets/triangles-square.jpg "https://i.imgur.com/ela7SVf.jpg"
          curl -fsSL -o docs/assets/rectangles-square.jpg "https://i.imgur.com/1G6rYqD.jpg"
          file docs/assets/*.png docs/assets/*.jpg | tail -16
      - name: 提交入库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets
          git diff --cached --quiet || (git commit -m "assets: 本地化外链图片（imgur，经 Actions 代取）" && git push)
