site_name: Learn Go with Tests 中文版
site_description: 用测试驱动开发（TDD）学习 Go 语言 —— quii/learn-go-with-tests 中文翻译
site_url: https://zeta2333.github.io/learn-go-with-tests-zh/

repo_url: https://github.com/quii/learn-go-with-tests
repo_name: quii/learn-go-with-tests

theme:
  name: material
  language: zh
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.mark
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode

copyright: >
  原著 <a href="https://github.com/quii/learn-go-with-tests">Learn Go with Tests</a>
  © Chris James（quii），MIT 协议；中文翻译遵循同一协议发布。

nav:
  - 前言: index.md
  - Go 基础:
      - 安装 Go: install-go.md
      - Hello, World: hello-world.md
      - 整数: integers.md
      - 迭代: iteration.md
      - 数组和切片: arrays-and-slices.md
      - 结构体、方法与接口: structs-methods-and-interfaces.md
      - 指针与错误: pointers-and-errors.md
      - Map: maps.md
      - 依赖注入: dependency-injection.md
      - Mocking: mocking.md
      - 并发: concurrency.md
      - Select: select.md
      - 反射: reflection.md
      - Sync: sync.md
      - Context: context.md
      - 基于属性的测试入门: roman-numerals.md
      - 数学: math.md
      - 读取文件: reading-files.md
      - HTML 模板: html-templates.md
      - 泛型: generics.md
      - 用泛型重访数组与切片: revisiting-arrays-and-slices-with-generics.md
  - 测试基础:
      - 验收测试入门: intro-to-acceptance-tests.md
      - 扩展验收测试: scaling-acceptance-tests.md
      - 不用 mock 的测试: working-without-mocks.md
      - 重构清单: refactoring-checklist.md
  - 问答:
      - OS Exec: os-exec.md
      - Error types: error-types.md
      - Context-aware Reader: context-aware-reader.md
      - 再探 HTTP Handlers: http-handlers-revisited.md
